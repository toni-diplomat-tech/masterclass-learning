# Local stack: `docker compose up`, then open http://localhost:3000/health.
# Secrets come from the environment or a git-ignored .env file (see .env.example).
# The default SA password below is for local development only.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev_Passw0rd}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ConnectionStrings__Quiz: "Server=sqlserver,1433;Database=MasterclassQuiz;User Id=sa;Password=${MSSQL_SA_PASSWORD:-LocalDev_Passw0rd};TrustServerCertificate=True"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  sqlserver-data:
